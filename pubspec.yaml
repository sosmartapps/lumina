name: lumina
description: Lumina - A comprehensive care management app for people with Alzheimer's and their caregivers.
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: '>=3.7.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter

  # ── Shared Packages ──────────────────────────────────────────────────────
  bug_reporter:
    path: packages/bug_reporter

  # Firebase
  firebase_core: ^4.5.0
  firebase_auth: ^6.2.0
  cloud_firestore: ^6.1.3
  firebase_storage: ^13.1.0
  firebase_messaging: ^16.1.2

  # State Management
  flutter_riverpod: ^3.2.1

  # Location & Maps
  google_maps_flutter: ^2.16.0
  geolocator: ^14.0.2
  geocoding: ^4.0.0
  flutter_polyline_points: ^3.1.0
  latlong2: ^0.9.0
  map_launcher: ^3.3.0

  # Phone & Communication
  url_launcher: ^6.2.2
  flutter_phone_direct_caller: ^2.1.1
  share_plus: ^12.0.1

  # Camera & Image
  image_picker: ^1.0.7
  google_mlkit_text_recognition: ^0.14.0

  # Text to Speech & Audio
  flutter_tts: ^4.2.5
  audioplayers: ^6.5.1

  # Notifications
  flutter_local_notifications: ^21.0.0

  # UI Components
  cupertino_icons: ^1.0.6
  google_fonts: ^8.0.2
  cached_network_image: ^3.3.1

  # Security
  crypto: ^3.0.3

  # Bouncie / Vehicle Tracking
  http: ^1.2.0
  flutter_dotenv: ^5.2.1

  # Battery & Sensor Monitoring
  battery_plus: ^6.0.0
  sensors_plus: ^6.1.0

  # Screenshot (for bug reporter)
  screenshot: ^3.0.0

  # In-App Purchases / Subscriptions
  purchases_flutter: ^8.0.0

  # Deep Links
  app_links: ^6.0.0

  # PDF Generation & Sharing
  pdf: ^3.11.0
  printing: ^5.13.0
  path_provider: ^2.1.1

  # Utilities
  intl: ^0.20.2
  timezone: ^0.11.0
  shared_preferences: ^2.2.2
  uuid: ^4.2.2
  permission_handler: ^12.0.1
  connectivity_plus: ^7.0.0
  device_info_plus: ^12.3.0

  # Background Services
  workmanager: ^0.9.0+3
  flutter_background_service: ^5.0.5

  # Firebase Monitoring
  firebase_crashlytics: ^5.0.8
  firebase_analytics: ^12.1.3

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0

flutter:
  uses-material-design: true

  assets:
    - .env
    - assets/images/
    - assets/sounds/

  # Fonts loaded via google_fonts package at runtime
  # No bundled fonts needed
