name: lumina
description: Lumina - A comprehensive care management app for people with Alzheimer's and their caregivers.
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: '>=3.2.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter

  # Firebase
  firebase_core: ^2.24.2
  firebase_auth: ^4.16.0
  cloud_firestore: ^4.14.0
  firebase_storage: ^11.6.0
  firebase_messaging: ^14.7.10

  # State Management
  provider: ^6.1.1
  flutter_riverpod: ^2.4.9

  # Location & Maps
  google_maps_flutter: ^2.5.3
  geolocator: ^10.1.0
  geocoding: ^2.1.1
  flutter_polyline_points: ^2.0.0

  # Geofencing
  geofence_service: ^5.0.0

  # Phone & Communication
  url_launcher: ^6.2.2
  flutter_phone_direct_caller: ^2.1.1
  share_plus: ^7.2.1

  # Camera & Image
  camera: ^0.10.5+7
  image_picker: ^1.0.7
  image_compare: ^1.0.0

  # Text to Speech & Audio
  flutter_tts: ^3.8.5
  audioplayers: ^5.2.1
  just_audio: ^0.9.36

  # Notifications
  flutter_local_notifications: ^16.3.2
  awesome_notifications: ^0.8.3

  # UI Components
  cupertino_icons: ^1.0.6
  google_fonts: ^6.1.0
  flutter_svg: ^2.0.9
  cached_network_image: ^3.3.1

  # Utilities
  intl: ^0.19.0
  timezone: ^0.9.2
  shared_preferences: ^2.2.2
  uuid: ^4.2.2
  permission_handler: ^11.2.0
  connectivity_plus: ^5.0.2
  device_info_plus: ^9.1.1

  # Background Services
  workmanager: ^0.5.2
  flutter_background_service: ^5.0.5

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^3.0.1

flutter:
  uses-material-design: true

  assets:
    - assets/images/
    - assets/sounds/

  # Fonts loaded via google_fonts package at runtime
  # No bundled fonts needed
