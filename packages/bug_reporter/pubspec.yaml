name: bug_reporter
description: Shared bug reporting package for all So Smart Apps.
version: 0.1.0

environment:
  sdk: '>=3.7.0 <4.0.0'
  flutter: '>=3.10.0'

dependencies:
  flutter:
    sdk: flutter
  firebase_crashlytics: ^5.0.7
  screenshot: ^3.0.0
  speech_to_text: ^7.0.0
  image_picker: ^1.1.0
  shake: ^3.0.0
  device_info_plus: ^12.3.0
  package_info_plus: ^8.0.0
  path_provider: ^2.1.0
  shared_preferences: ^2.2.2
  http: ^1.2.0
  uuid: ^4.3.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
