name: Daily Doctor (Analyze + Test + Best-Effort Fix)

on:
  schedule:
    # Daily at 06:30 UTC (11:30 PM Arizona)
    - cron: '30 6 * * *'
  workflow_dispatch: {}

jobs:
  doctor:
    runs-on: ubuntu-latest
    permissions:
      contents: read

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Generate Firebase stub for CI
        run: |
          cat > lib/firebase_options.dart << 'DART'
          import 'package:firebase_core/firebase_core.dart' show FirebaseOptions;
          import 'package:flutter/foundation.dart'
              show defaultTargetPlatform, kIsWeb, TargetPlatform;
          class DefaultFirebaseOptions {
            static FirebaseOptions get currentPlatform {
              if (kIsWeb) return web;
              switch (defaultTargetPlatform) {
                case TargetPlatform.android: return android;
                case TargetPlatform.iOS: return ios;
                case TargetPlatform.macOS: return macos;
                default: throw UnsupportedError('Unsupported platform');
              }
            }
            static const FirebaseOptions web = FirebaseOptions(
              apiKey: 'ci', appId: 'ci', messagingSenderId: 'ci', projectId: 'ci',
            );
            static const FirebaseOptions android = FirebaseOptions(
              apiKey: 'ci', appId: 'ci', messagingSenderId: 'ci', projectId: 'ci',
            );
            static const FirebaseOptions ios = FirebaseOptions(
              apiKey: 'ci', appId: 'ci', messagingSenderId: 'ci', projectId: 'ci',
            );
            static const FirebaseOptions macos = FirebaseOptions(
              apiKey: 'ci', appId: 'ci', messagingSenderId: 'ci', projectId: 'ci',
            );
          }
          DART

      - name: Pub get
        run: flutter pub get

      - name: Analyze
        id: analyze
        run: flutter analyze

      - name: Test
        id: test
        run: flutter test

      # If analyze/test fails, try a safe automated fix pass.
      - name: Best-effort fix (dart fix + format)
        if: failure()
        run: |
          dart fix --apply || true
          dart format .

      - name: Re-run Analyze
        if: failure()
        run: flutter analyze

      - name: Re-run Test
        if: failure()
        run: flutter test

      - name: Create patch artifact
        if: always()
        run: |
          git diff --patch --minimal > patch.diff || true
          wc -l patch.diff || true

      - name: Upload patch artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: daily-doctor-patch
          path: patch.diff
